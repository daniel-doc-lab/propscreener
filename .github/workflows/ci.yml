name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check propscreener tests
      - run: pytest -q
      - name: Byg demodashboard (røgtest af skabelon)
        run: propscreener demo -n 20 --out /tmp/demo --site /tmp/demo/index.html
