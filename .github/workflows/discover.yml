name: Opdag Statstidende-endpoints

# Diagnoseværktøj: dumper Statstidende API'ets OpenAPI-spec, tester hvilke endpoints der
# svarer uden certifikat, og afdækker hvilke stier statstidende.dk's frontend bruger.
# Skriver kun til loggen (og gemmer spec'en som artefakt).

on:
  push:
    branches: ["claude/danish-bankruptcy-scraper-5vt1u3"]
    paths: [".github/workflows/discover.yml"]
  workflow_dispatch:
    inputs:
      extra_url:
        description: "Ekstra URL at afprøve (valgfri)"
        default: ""

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: OpenAPI-spec for api.statstidende.dk
        run: |
          UA="propscreener-discovery/0.1 (+https://github.com/${{ github.repository }})"
          curl -sS -m 30 -A "$UA" -o swagger.json -w "status=%{http_code} size=%{size_download}\n" https://api.statstidende.dk/swagger/v1/swagger.json
          python - <<'EOF'
          import json, re
          s = json.load(open("swagger.json"))
          info = s.get("info", {})
          print("TITLE:", info.get("title"), "VERSION:", info.get("version"))
          desc = re.sub(r"<[^>]+>", " ", info.get("description", ""))
          print("DESC:", re.sub(r"\s+", " ", desc)[:1500])
          print("SERVERS:", s.get("servers"))
          print("SECURITY (global):", s.get("security"))
          print("SECURITY SCHEMES:", json.dumps(s.get("components", {}).get("securitySchemes"), ensure_ascii=False))
          print("=== PATHS ===")
          for p, ops in s.get("paths", {}).items():
              for m, op in ops.items():
                  if m not in ("get", "post", "put", "delete", "patch"):
                      continue
                  params = [f"{x.get('name')}({x.get('in')}{'*' if x.get('required') else ''})" for x in op.get("parameters", [])]
                  body = ""
                  rb = op.get("requestBody", {}).get("content", {})
                  if rb:
                      sch = next(iter(rb.values())).get("schema", {})
                      body = " body=" + (sch.get("$ref", "").split("/")[-1] or json.dumps(sch)[:120])
                  print(f"{m.upper():6s} {p:55s} sec={op.get('security', '-')} tags={op.get('tags')} params={params}{body}")
                  if op.get("summary") or op.get("description"):
                      print("       ", re.sub(r"\s+", " ", (op.get("summary") or "") + " | " + (op.get("description") or ""))[:300])
          print("=== SCHEMAS ===")
          for name, sch in s.get("components", {}).get("schemas", {}).items():
              props = sch.get("properties", {})
              print(f"{name}: " + ", ".join(f"{k}:{v.get('type', v.get('$ref', '?')).split('/')[-1]}" for k, v in props.items())[:900])
              if sch.get("enum"):
                  print("   enum:", sch["enum"])
          EOF

      - name: Kald GET-endpoints uden certifikat
        run: |
          UA="propscreener-discovery/0.1 (+https://github.com/${{ github.repository }})"
          python - <<'EOF' > urls.txt
          import json
          s = json.load(open("swagger.json"))
          base = "https://api.statstidende.dk"
          for p, ops in s.get("paths", {}).items():
              if "get" in ops and "{" not in p:
                  print(base + p)
          EOF
          cat urls.txt
          while read -r u; do
            echo "----- GET $u"
            curl -sS -m 25 -A "$UA" -H "Accept: application/json" -o body.txt -w "status=%{http_code} type=%{content_type} size=%{size_download}\n" "$u" || echo curl-fejl
            head -c 600 body.txt | tr '\n' ' '; echo
          done < urls.txt
          echo "----- api.statstidende.dk/ (redirect-mål)"
          curl -sS -m 25 -A "$UA" -o /dev/null -w "status=%{http_code} redirect=%{redirect_url}\n" https://api.statstidende.dk/

      - name: Frontend – chunks, api/-stier og søgekald
        run: |
          UA="propscreener-discovery/0.1 (+https://github.com/${{ github.repository }})"
          curl -sSL -A "$UA" -o index.html https://www.statstidende.dk/
          mkdir -p bundles
          for a in $(grep -oE 'src="[^"]+\.js[^"]*"' index.html | sed 's/src="//; s/"$//'); do
            case "$a" in http*) u="$a";; /*) u="https://www.statstidende.dk$a";; *) u="https://www.statstidende.dk/$a";; esac
            curl -sSL -A "$UA" -o "bundles/main.js" "$u" || true
          done
          echo "== webpack chunk-skabelon =="
          grep -oE '.{0,80}"static/js/".{0,200}' bundles/main.js | head -3
          echo "== chunk-map =="
          python3 - <<'EOF'
          import re, json
          js = open("bundles/main.js", encoding="utf-8", errors="replace").read()
          maps = re.findall(r'\{(\d+:"[0-9a-f]{6,}"(?:,\d+:"[0-9a-f]{6,}")*)\}', js)
          ids = {}
          for m in maps:
              for k, v in re.findall(r'(\d+):"([0-9a-f]{6,})"', m):
                  ids[k] = v
          print(len(ids), "chunks")
          with open("chunks.txt", "w") as f:
              for k, v in ids.items():
                  f.write(f"static/js/{k}.{v}.chunk.js\n")
          EOF
          head -50 chunks.txt
          while read -r c; do curl -sS -m 20 -A "$UA" -o "bundles/$(basename "$c")" "https://www.statstidende.dk/$c" || true; done < chunks.txt
          ls -la bundles | head -80
          echo "== /api/config (fuldt) =="
          curl -sS -m 20 -A "$UA" https://www.statstidende.dk/api/config | tee config.json; echo
          echo "== URL'er i config – prøv dem =="
          for u in $(grep -oE 'https?://[^" ]+' config.json | sort -u); do
            printf "%s -> " "$u"; curl -sS -m 20 -A "$UA" -o body.txt -w "%{http_code} %{content_type} %{size_download}b\n" "$u" || echo curl-fejl
            head -c 300 body.txt | tr '\n' ' '; echo
          done
          echo "== søgerelaterede identifikatorer i main.js =="
          grep -ohE '.{0,400}(searchService|SearchService|searchUrl|searchApi|searchBase|searchEndpoint|wasUrl|opensearch|elastic).{0,400}' bundles/main.js | head -10
          echo "== template-URLs med variabel host =="
          grep -ohE '`\$\{[^}]{1,60}\}/[A-Za-z0-9/_.${}?=&-]+`' bundles/*.js | sort -u | head -40
          echo "== webpack-modul 84083 (search) =="
          grep -oE '84083:\(e,t,n\)=>\{.{0,3500}' bundles/main.js | head -c 3600; echo
          echo "== webpack-modul 15377 (searchServiceClient) =="
          grep -oE '15377:\(e,t,n\)=>\{.{0,2500}' bundles/main.js | head -c 2600; echo
          echo "== webpack-modul 3057 (messages) =="
          grep -oE '3057:\(e,t,n\)=>\{.{0,2500}' bundles/main.js | head -c 2600; echo
          echo "== forekomster af 'messagesearch' uden api-præfiks =="
          grep -ohiE '.{0,200}messagesearch.{0,200}' bundles/*.js | grep -viE 'subscri' | head -6
          echo "== fetch-kald (ikke axios) =="
          grep -ohE 'fetch\(`[^`]{0,200}`|fetch\("[^"]{0,200}"' bundles/*.js | sort -u | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: statstidende-openapi
          path: swagger.json
